<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股戰士｜管理後台</title><link rel="stylesheet" href="/admin/style.css"><script defer src="/admin/app.js"></script></head>
<body><header><a href="https://00160530.github.io/StockFighterAJO/">韭　台股戰士</a><span>管理後台</span><button id="logout" hidden>登出</button></header><main><section id="loginPanel" class="login-panel"><span class="login-mark">韭</span><h1>小韭的服務台</h1><p>登入後查看許願、問題回報與排行榜成績。</p><form id="loginForm"><label>管理帳號<input id="adminUsername" autocomplete="username" maxlength="40" required></label><label>管理密碼<input id="adminPassword" type="password" autocomplete="current-password" maxlength="128" required></label><p id="loginMessage" role="status"></p><button type="submit">登入管理後台</button></form></section><section id="adminPanel" hidden><div class="heading"><div><h1>小韭的服務台</h1><p id="identity">正在確認登入…</p></div><button id="refresh">重新整理</button></div><section id="overview" class="counts" aria-label="服務概況"></section><nav aria-label="管理分類"><button id="feedbackTab" aria-pressed="true">許願池及問題回報</button><button id="runsTab" aria-pressed="false">排行榜成績</button></nav><div class="toolbar"><label id="statusFilterLabel">回報狀態 <select id="statusFilter"><option value="new">新回報</option><option value="all">全部</option><option value="read">已讀</option><option value="planned">規劃中</option><option value="done">已完成</option><option value="closed">已結案</option></select></label><span id="pageInfo"></span></div><p id="message" role="status"></p><section id="content" aria-live="polite"></section><div class="paging"><button id="prev">← 上一頁</button><button id="next">下一頁 →</button></div><footer>回報只在這個後台顯示。排行榜為基本檢核成績；異常紀錄可下架保留稽核，不會刪除玩家的本機進度。</footer></section></main></body></html>
